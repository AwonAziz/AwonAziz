<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub Stats — Awon Aziz" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace">
  <title>GitHub Stats — Awon Aziz</title>
  <defs>
    <filter id="matrixGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="hexGrid" width="40" height="35" patternUnits="userSpaceOnUse">
      <path d="M20,0 L40,10 L40,25 L20,35 L0,25 L0,10 Z" fill="none" stroke="#00ff41" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
    <pattern id="scanline" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff41" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#0a0713" rx="8"/>
  <rect width="100%" height="100%" fill="url(#hexGrid)" rx="8"/>
  <rect width="100%" height="100%" fill="url(#scanline)" rx="8"/>
  <rect width="100%" height="100%" fill="none" stroke="#00ff41" stroke-width="1" rx="8" opacity="0.25"/>

    <!-- Matrix rain strip (right side, subtle) -->
  <g opacity="0.10" transform="translate(360, 40)">
    <text x="0" y="0" font-size="8" fill="#00ff41">
      <animate attributeName="y" values="-40;200" dur="2.5s" calcMode="discrete" repeatCount="indefinite"/>
      <tspan x="0" dy="10">1</tspan>
      <tspan x="0" dy="10">0</tspan>
      <tspan x="0" dy="10">1</tspan>
      <tspan x="0" dy="10">0</tspan>
    </text>
    <text x="12" y="0" font-size="8" fill="#00ff41">
      <animate attributeName="y" values="-50;200" dur="3s" begin="-0.8s" calcMode="discrete" repeatCount="indefinite"/>
      <tspan x="12" dy="10">0</tspan>
      <tspan x="12" dy="10">1</tspan>
      <tspan x="12" dy="10">0</tspan>
      <tspan x="12" dy="10">1</tspan>
    </text>
  </g>

    <!-- Title bar -->
  <rect x="1" y="1" width="398" height="28" rx="8" fill="#001a00" opacity="0.8"/>
  <rect x="1" y="1" width="398" height="28" rx="8" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
  <text x="16" y="20" font-size="11" fill="#00ff41" font-weight="bold" letter-spacing="1" filter="url(#softGlow)">GITHUB STATS</text>
  <text x="380" y="20" font-size="9" fill="#00aa00" text-anchor="end" letter-spacing="1">AWONAZIZ</text>

  <!-- Accent line under title -->
  <line x1="16" y1="34" x2="384" y2="34" stroke="#00ff41" stroke-width="0.5" opacity="0.4"/>
  <rect x="16" y="33" width="80" height="2" fill="#00ff41" opacity="0.8">
    <animate attributeName="width" values="0;80" dur="1s" begin="0.01s" fill="freeze"/>
  </rect>

  <!-- Stats rows -->
  <g transform="translate(16, 44)">
    <text x="0" y="16" font-size="10" fill="#00aa00" letter-spacing="0.5">PUBLIC REPOS</text>
    <text x="368" y="16" font-size="15" font-weight="bold" fill="#00ff41" text-anchor="end" filter="url(#matrixGlow)">18</text>
    <line x1="0" y1="22" x2="368" y2="22" stroke="#003300" stroke-width="0.5"/>

    <text x="0" y="40" font-size="10" fill="#00aa00" letter-spacing="0.5">TOTAL STARS</text>
    <text x="368" y="40" font-size="15" font-weight="bold" fill="#00ff41" text-anchor="end" filter="url(#matrixGlow)">1</text>
    <line x1="0" y1="46" x2="368" y2="46" stroke="#003300" stroke-width="0.5"/>

    <text x="0" y="64" font-size="10" fill="#00aa00" letter-spacing="0.5">TOTAL FORKS</text>
    <text x="368" y="64" font-size="15" font-weight="bold" fill="#00ff41" text-anchor="end" filter="url(#matrixGlow)">0</text>
    <line x1="0" y1="70" x2="368" y2="70" stroke="#003300" stroke-width="0.5"/>

    <text x="0" y="88" font-size="10" fill="#00aa00" letter-spacing="0.5">FOLLOWERS</text>
    <text x="368" y="88" font-size="15" font-weight="bold" fill="#00ff41" text-anchor="end" filter="url(#matrixGlow)">1</text>
    <line x1="0" y1="94" x2="368" y2="94" stroke="#003300" stroke-width="0.5"/>
  </g>

    <!-- Footer -->
  <rect x="16" y="216" width="368" height="14" rx="3" fill="#001a00" opacity="0.5"/>
  <text x="200" y="227" text-anchor="middle" font-size="9" fill="#00aa00" font-weight="bold" letter-spacing="1">SYSTEM OPERATIONAL</text>
</svg>