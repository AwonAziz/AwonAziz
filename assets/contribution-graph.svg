def generate_languages(lang_bytes):
    """Generate languages.svg with real language data."""
    if not lang_bytes:
        lang_bytes = {"Python": 1000}

    total = sum(lang_bytes.values())
    sorted_langs = sorted(lang_bytes.items(), key=lambda x: x[1], reverse=True)[:6]
    colors = ["#3776AB", "#3178C6", "#00AA00", "#E34F26", "#C471ED", "#F7DF1E"]

    bars = []
    y = 14
    bar_spacing = 24
    for i, (lang, bytes_count) in enumerate(sorted_langs):
        pct = bytes_count / total * 100 if total > 0 else 0
        bar_width = int(368 * bytes_count / max(lang_bytes.values())) if lang_bytes.values() else 100
        color = colors[i % len(colors)]
        bars.append(f'''
    <text x="0" y="{y}" font-size="10" fill="#5eead4" font-weight="bold">{esc(lang)}</text>
    <text x="368" y="{y}" font-size="9" fill="#00ff41" text-anchor="end">{pct:.0f}%</text>
    <rect x="0" y="{y + 4}" width="368" height="6" rx="3" fill="#001a00"/>
    <rect x="0" y="{y + 4}" width="0" height="6" rx="3" fill="{color}" filter="url(#softGlow)">
      <animate attributeName="width" values="0;{bar_width}" dur="{1.0 + i * 0.1:.1f}s" begin="{0.01 + i * 0.1:.2f}s" fill="freeze"/>
    </rect>''')
        y += bar_spacing

    body = f'''
  <!-- Matrix rain strip (right side, subtle) -->
  <g opacity="0.10" transform="translate(360, 40)">
    <text x="0" y="0" font-size="8" fill="#00ff41">
      <animate attributeName="y" values="-40;240" dur="2.5s" calcMode="discrete" repeatCount="indefinite"/>
      <tspan x="0" dy="10">1</tspan>
      <tspan x="0" dy="10">0</tspan>
      <tspan x="0" dy="10">1</tspan>
      <tspan x="0" dy="10">0</tspan>
    </text>
    <text x="12" y="0" font-size="8" fill="#00ff41">
      <animate attributeName="y" values="-50;240" dur="3s" begin="-0.8s" calcMode="discrete" repeatCount="indefinite"/>
      <tspan x="12" dy="10">0</tspan>
      <tspan x="12" dy="10">1</tspan>
      <tspan x="12" dy="10">0</tspan>
      <tspan x="12" dy="10">1</tspan>
    </text>
  </g>

  <!-- Title bar -->
  <rect x="1" y="1" width="398" height="28" rx="8" fill="#001a00" opacity="0.8"/>
  <rect x="1" y="1" width="398" height="28" rx="8" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
  <text x="16" y="20" font-size="11" fill="#00ff41" font-weight="bold" letter-spacing="1" filter="url(#softGlow)">TOP LANGUAGES</text>
  <text x="380" y="20" font-size="9" fill="#00aa00" text-anchor="end" letter-spacing="1">REAL DATA</text>

  <!-- Accent line under title -->
  <line x1="16" y1="34" x2="384" y2="34" stroke="#00ff41" stroke-width="0.5" opacity="0.4"/>
  <rect x="16" y="33" width="80" height="2" fill="#00ff41" opacity="0.8">
    <animate attributeName="width" values="0;80" dur="1s" begin="0.01s" fill="freeze"/>
  </rect>

  <!-- Language bars -->
  <g transform="translate(16, 44)">
    {''.join(bars)}
  </g>

  <!-- Footer -->
  <rect x="16" y="{44 + y + 4}" width="368" height="14" rx="3" fill="#001a00" opacity="0.5"/>
  <text x="200" y="{44 + y + 15}" text-anchor="middle" font-size="9" fill="#00aa00" font-weight="bold" letter-spacing="1">MACHINE LEARNING FOCUS</text>
</svg>'''
    return svg_header(400, 44 + y + 24, "Top Languages — Awon Aziz", "Top Languages — Awon Aziz") + body


