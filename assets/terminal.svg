<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System Terminal - Awon Aziz" font-family="Consolas, monospace">
  <title>System Terminal - Awon Aziz</title>
  <defs>
    <filter id="matrixGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="hexGrid" width="40" height="35" patternUnits="userSpaceOnUse">
      <path d="M20,0 L40,10 L40,25 L20,35 L0,25 L0,10 Z" fill="none" stroke="#00ff41" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
    <pattern id="scanline" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff41" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#0a0713" rx="12"/>
  <rect width="800" height="300" fill="url(#hexGrid)" rx="12"/>
  <rect width="800" height="300" fill="url(#scanline)" rx="12"/>
  <rect width="800" height="300" fill="none" stroke="#00ff41" stroke-width="1" rx="12" opacity="0.25"/>

  <!-- Matrix rain strip (right side, subtle) -->
  <g opacity="0.10" transform="translate(756, 40)">
    <text x="0" y="0" font-size="8" fill="#00ff41">
      <animate attributeName="y" values="-40;260" dur="2.5s" calcMode="discrete" repeatCount="indefinite"/>
      <tspan x="0" dy="10">1</tspan>
      <tspan x="0" dy="10">0</tspan>
      <tspan x="0" dy="10">1</tspan>
      <tspan x="0" dy="10">0</tspan>
    </text>
    <text x="12" y="0" font-size="8" fill="#00ff41">
      <animate attributeName="y" values="-50;260" dur="3s" begin="-0.8s" calcMode="discrete" repeatCount="indefinite"/>
      <tspan x="12" dy="10">0</tspan>
      <tspan x="12" dy="10">1</tspan>
      <tspan x="12" dy="10">0</tspan>
      <tspan x="12" dy="10">1</tspan>
    </text>
  </g>

  <!-- Title bar -->
  <rect x="1" y="1" width="798" height="28" rx="12" fill="#001a00" opacity="0.8"/>
  <rect x="1" y="1" width="798" height="28" rx="12" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
  <circle cx="20" cy="15" r="5" fill="#ff3333" opacity="0.8"/>
  <circle cx="36" cy="15" r="5" fill="#ffcc00" opacity="0.8"/>
  <circle cx="52" cy="15" r="5" fill="#33ff33" opacity="0.8"/>
  <text x="76" y="20" font-size="11" fill="#00ff41" font-weight="bold" letter-spacing="1" filter="url(#softGlow)">root@awon:~#</text>
  <text x="776" y="20" font-size="9" fill="#00aa00" text-anchor="end" letter-spacing="1">TERMINAL v2.4.1 [ONLINE]</text>

  <!-- Accent line under title -->
  <line x1="16" y1="34" x2="784" y2="34" stroke="#00ff41" stroke-width="0.5" opacity="0.4"/>
  <rect x="16" y="33" width="120" height="2" fill="#00ff41" opacity="0.8">
    <animate attributeName="width" values="0;120" dur="1s" begin="0.01s" fill="freeze"/>
  </rect>

  <!-- Left column: Boot + Identity + Status -->
  <g transform="translate(20, 44)">
    <!-- Boot messages -->
    <text x="0" y="12" font-size="9" fill="#00aa00" opacity="0.7">[BOOT] Initializing system...</text>
    <text x="0" y="24" font-size="9" fill="#00aa00" opacity="0.7">[OK] Kernel loaded</text>
    <text x="0" y="36" font-size="9" fill="#00aa00" opacity="0.7">[OK] MLOps modules active</text>
    <text x="0" y="48" font-size="9" fill="#00aa00" opacity="0.7">[OK] Drift detection online</text>
    <text x="0" y="60" font-size="9" fill="#00ff41" opacity="0.9">[SYSTEM] User profile loaded</text>

    <!-- Divider -->
    <line x1="0" y1="68" x2="360" y2="68" stroke="#003300" stroke-width="0.5"/>

    <!-- Identity -->
    <text x="0" y="82" font-size="13" fill="#00ff41" font-weight="bold" filter="url(#matrixGlow)">AWON AZIZ</text>
    <text x="0" y="96" font-size="10" fill="#00aa00">AI/MLOps Engineer</text>
    <text x="0" y="110" font-size="9" fill="#006600">LLM Eval - Drift Detection - Promotion Gates</text>

    <!-- Divider -->
    <line x1="0" y1="118" x2="360" y2="118" stroke="#003300" stroke-width="0.5"/>

    <!-- System status -->
    <text x="0" y="132" font-size="9" fill="#00aa00" font-weight="bold">STATUS:</text>
    <text x="60" y="132" font-size="9" fill="#00ff41">ONLINE</text>
    <text x="0" y="146" font-size="9" fill="#00aa00" font-weight="bold">CLEARANCE:</text>
    <text x="72" y="146" font-size="9" fill="#00ff41">LEVEL 5</text>
    <text x="0" y="160" font-size="9" fill="#00aa00" font-weight="bold">LOCATION:</text>
    <text x="64" y="160" font-size="9" fill="#00ff41">Islamabad, PK</text>
    <text x="0" y="174" font-size="9" fill="#00aa00" font-weight="bold">AVAILABILITY:</text>
    <text x="80" y="174" font-size="9" fill="#00ff41">REMOTE (EU/US)</text>

    <!-- Divider -->
    <line x1="0" y1="182" x2="360" y2="182" stroke="#003300" stroke-width="0.5"/>

    <!-- Contact -->
    <text x="0" y="196" font-size="9" fill="#00aa00" font-weight="bold">CONTACT:</text>
    <text x="0" y="210" font-size="9" fill="#00cc33">github.com/AwonAziz</text>
    <text x="0" y="224" font-size="9" fill="#00cc33">linkedin.com/in/awonaziz</text>
    <text x="0" y="238" font-size="9" fill="#00cc33">awonaziz786@gmail.com</text>

    <!-- Tagline -->
    <text x="0" y="256" font-size="9" fill="#00ff41" font-style="italic" filter="url(#matrixGlow)">"Operationalizing ML, one gate at a time."</text>
  </g>

  <!-- Right column: What I Build + Stack -->
  <g transform="translate(400, 44)">
    <!-- What I Build header -->
    <text x="0" y="12" font-size="10" fill="#00ff41" font-weight="bold" filter="url(#softGlow)">WHAT I BUILD</text>
    <line x1="0" y1="16" x2="360" y2="16" stroke="#003300" stroke-width="0.5"/>

    <!-- What I Build table -->
    <g transform="translate(0, 24)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="360" height="28" rx="3" fill="#0d0716" stroke="#003300" stroke-width="0.5"/>
      <text x="8" y="12" font-size="9" fill="#5eead4" font-weight="bold">MLOps &amp; LLM Eval</text>
      <text x="8" y="24" font-size="8" fill="#00aa00">Python - PyTorch - ONNX - FastAPI - MLflow</text>

      <!-- Row 2 -->
      <rect x="0" y="32" width="360" height="28" rx="3" fill="#0d0716" stroke="#003300" stroke-width="0.5"/>
      <text x="8" y="44" font-size="9" fill="#5eead4" font-weight="bold">Drift Detection</text>
      <text x="8" y="56" font-size="8" fill="#00aa00">Evidently AI - MLflow - DuckDB</text>

      <!-- Row 3 -->
      <rect x="0" y="64" width="360" height="28" rx="3" fill="#0d0716" stroke="#003300" stroke-width="0.5"/>
      <text x="8" y="76" font-size="9" fill="#5eead4" font-weight="bold">Promotion Gates</text>
      <text x="8" y="88" font-size="8" fill="#00aa00">Chroma - Kubernetes - GitHub Actions</text>

      <!-- Row 4 -->
      <rect x="0" y="96" width="360" height="28" rx="3" fill="#0d0716" stroke="#003300" stroke-width="0.5"/>
      <text x="8" y="108" font-size="9" fill="#5eead4" font-weight="bold">Serving &amp; Infra</text>
      <text x="8" y="120" font-size="8" fill="#00aa00">Docker - SQL - AWS - Azure - GCP</text>
    </g>

    <!-- Stack preview -->
    <text x="0" y="160" font-size="10" fill="#00ff41" font-weight="bold" filter="url(#softGlow)">STACK PREVIEW</text>
    <line x1="0" y1="164" x2="360" y2="164" stroke="#003300" stroke-width="0.5"/>
    <text x="0" y="178" font-size="9" fill="#00cc33">Python - PyTorch - ONNX - FastAPI - MLflow</text>
    <text x="0" y="192" font-size="9" fill="#00cc33">DuckDB - Chroma - Docker - K8s - AWS</text>
    <text x="0" y="206" font-size="9" fill="#00cc33">TypeScript - React - Next.js - PostgreSQL</text>

    <!-- Command prompt -->
    <text x="0" y="232" font-size="11" fill="#33ff33" font-weight="bold">root@awon:~#</text>
    <text x="90" y="232" font-size="11" fill="#00ff41">cat profile.md</text>
    <text x="195" y="232" font-size="11" fill="#00ff41" font-weight="bold">_
      <animate attributeName="opacity" values="1;0" dur="0.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Footer status bar -->
  <rect x="1" y="278" width="798" height="20" rx="0 0 12 12" fill="#001a00" stroke="#00ff41" stroke-width="0.5" opacity="0.8"/>
  <text x="400" y="292" text-anchor="middle" font-size="9" fill="#00aa00" font-weight="bold" letter-spacing="1">SYSTEM READY - MATRIX ACTIVE</text>
</svg>
