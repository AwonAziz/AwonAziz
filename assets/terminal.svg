<svg width="420" height="720" viewBox="0 0 420 720" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', 'Noto Sans Mono', monospace">
  <defs>
    <!-- Terminal background -->
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Window title bar -->
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <!-- Glow for matrix green -->
    <filter id="matrixGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline pattern -->
    <pattern id="scanline" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff41" opacity="0.06"/>
    </pattern>

    <!-- Scanline animation overlay -->
    <pattern id="scanlineMove" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff41" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- Terminal window container -->
  <g transform="translate(10, 20)">
    <!-- Outer border -->
    <rect x="0" y="0" width="400" height="680" rx="12" fill="#000000" stroke="#003300" stroke-width="2"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="400" height="40" rx="12" fill="url(#titleBar)" />
    <rect x="0" y="0" width="400" height="40" rx="12" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.5"/>

    <!-- Window control buttons -->
    <circle cx="34" cy="20" r="7" fill="#ff3333" opacity="0.8"/>
    <circle cx="54" cy="20" r="7" fill="#ffcc00" opacity="0.8"/>
    <circle cx="74" cy="20" r="7" fill="#33ff33" opacity="0.8"/>

    <!-- Title text -->
    <text x="110" y="25" font-size="13" fill="#00ff41" font-weight="bold" letter-spacing="1">root@awon:~#</text>
    <text x="110" y="38" font-size="10" fill="#00aa00" opacity="0.7">TERMINAL v2.4.1  [SYSTEM: ONLINE]</text>

    <!-- Terminal content area -->
    <g transform="translate(25, 55)">
      <!-- Boot messages -->
      <text x="0" y="20" font-size="12" fill="#00aa00" opacity="0.6">[BOOT] Initializing system...</text>
      <text x="0" y="38" font-size="12" fill="#00aa00" opacity="0.6">[OK] Kernel loaded</text>
      <text x="0" y="56" font-size="12" fill="#00aa00" opacity="0.6">[OK] MLOps modules active</text>
      <text x="0" y="74" font-size="12" fill="#00aa00" opacity="0.6">[OK] Drift detection online</text>
      <text x="0" y="92" font-size="12" fill="#00aa00" opacity="0.6">[OK] Promotion gates ready</text>
      <text x="0" y="112" font-size="12" fill="#00ff41" opacity="0.9">[SYSTEM] User profile loaded</text>

      <text x="0" y="132" font-size="12" fill="#00ff41" opacity="0.5">________________________________________</text>

      <!-- Identity block -->
      <text x="0" y="152" font-size="13" fill="#00ff41" font-weight="bold" filter="url(#matrixGlow)">AWON AZIZ</text>
      <text x="0" y="172" font-size="11" fill="#00aa00">AI/MLOps Engineer</text>
      <text x="0" y="188" font-size="10" fill="#006600">LLM Eval · Drift Detection · Promotion Gates</text>

      <text x="0" y="210" font-size="12" fill="#00ff41" opacity="0.5">________________________________________</text>

      <!-- System status -->
      <text x="0" y="228" font-size="11" fill="#00aa00" font-weight="bold">STATUS:</text>
      <text x="70" y="228" font-size="11" fill="#00ff41">ONLINE</text>

      <text x="0" y="248" font-size="11" fill="#00aa00" font-weight="bold">CLEARANCE:</text>
      <text x="82" y="248" font-size="11" fill="#00ff41">LEVEL 5</text>

      <text x="0" y="268" font-size="11" fill="#00aa00" font-weight="bold">LOCATION:</text>
      <text x="72" y="268" font-size="11" fill="#00ff41">Islamabad, PK</text>

      <text x="0" y="288" font-size="11" fill="#00aa00" font-weight="bold">AVAILABILITY:</text>
      <text x="88" y="288" font-size="11" fill="#00ff41">REMOTE (EU/US)</text>

      <text x="0" y="310" font-size="12" fill="#00ff41" opacity="0.5">________________________________________</text>

      <!-- Contact block -->
      <text x="0" y="330" font-size="11" fill="#00aa00" font-weight="bold">CONTACT:</text>
      <text x="0" y="350" font-size="11" fill="#00cc33">> github.com/AwonAziz</text>
      <text x="0" y="368" font-size="11" fill="#00cc33">> linkedin.com/in/awonaziz</text>
      <text x="0" y="386" font-size="11" fill="#00cc33">> awonaziz786@gmail.com</text>

      <text x="0" y="408" font-size="12" fill="#00ff41" opacity="0.5">________________________________________</text>

      <!-- Tech stack preview -->
      <text x="0" y="428" font-size="11" fill="#00aa00" font-weight="bold">STACK:</text>
      <text x="0" y="446" font-size="10" fill="#00cc33">Python · PyTorch · ONNX · FastAPI</text>
      <text x="0" y="462" font-size="10" fill="#00cc33">MLflow · DuckDB · Chroma · Docker</text>
      <text x="0" y="478" font-size="10" fill="#00cc33">Kubernetes · GitHub Actions · Evidently</text>

      <text x="0" y="500" font-size="12" fill="#00ff41" opacity="0.5">________________________________________</text>

      <!-- Tagline -->
      <text x="0" y="520" font-size="11" fill="#00ff41" font-style="italic" filter="url(#matrixGlow)">"Operationalizing ML, one gate at a time."</text>

      <!-- Command prompt at bottom -->
      <text x="0" y="560" font-size="13" fill="#33ff33" font-weight="bold">root@awon:~#</text>
      <text x="95" y="560" font-size="13" fill="#00ff41">cat profile.md</text>

      <!-- Blinking cursor -->
      <text x="205" y="560" font-size="13" fill="#00ff41" font-weight="bold">_</text>
      <animate attributeName="opacity" values="1;0" dur="0.8s" repeatCount="indefinite"/>

      <!-- Typing effect for additional lines -->
      <text x="95" y="582" font-size="12" fill="#00aa00" opacity="0">
        Loading profile data...
      </text>
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>

      <text x="95" y="602" font-size="12" fill="#00cc33" opacity="0">
        Profile rendered successfully.
      </text>
      <animate attributeName="opacity" values="0;1" dur="1s" begin="1.5s" fill="freeze"/>

      <text x="95" y="622" font-size="12" fill="#00ff41" opacity="0">
        System ready.
      </text>
      <animate attributeName="opacity" values="0;1" dur="1s" begin="2.5s" fill="freeze"/>
    </g>

    <!-- Scanline overlay animation -->
    <rect x="0" y="40" width="400" height="640" fill="url(#scanline)" pointer-events="none">
      <animate attributeName="y" values="40;720" dur="0.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Bottom status bar -->
    <rect x="0" y="680" width="400" height="20" rx="0 0 12 12" fill="#001a00" stroke="#00ff41" stroke-width="1"/>
    <text x="200" y="696" text-anchor="middle" font-size="10" fill="#00aa00" font-weight="bold">SYSTEM READY • MATRIX ACTIVE</text>
  </g>
</svg>
