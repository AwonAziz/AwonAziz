<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech Stack — Awon Aziz" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace">
  <title>Tech Stack — Awon Aziz</title>
  <defs>
    <!-- Glow filters -->
    <filter id="matrixGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background patterns -->
    <pattern id="hexGrid" width="40" height="35" patternUnits="userSpaceOnUse">
      <path d="M20,0 L40,10 L40,25 L20,35 L0,25 L0,10 Z" fill="none" stroke="#00ff41" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
    <pattern id="scanline" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff41" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0a0713" rx="12"/>
  <rect width="100%" height="100%" fill="url(#hexGrid)" rx="12"/>
  <rect width="100%" height="100%" fill="url(#scanline)" rx="12"/>

  <!-- Border -->
  <rect width="100%" height="100%" fill="none" stroke="#00ff41" stroke-width="1" rx="12" opacity="0.25"/>

  <!-- Matrix rain strip (right side, subtle) -->
  <g opacity="0.12" transform="translate(740, 40)">
    <text x="0" y="0" font-size="10" fill="#00ff41">
      <animate attributeName="y" values="-60;260" dur="3s" calcMode="discrete" repeatCount="indefinite"/>
      <tspan x="0" dy="12">1</tspan>
      <tspan x="0" dy="12">0</tspan>
      <tspan x="0" dy="12">1</tspan>
      <tspan x="0" dy="12">0</tspan>
      <tspan x="0" dy="12">1</tspan>
    </text>
    <text x="14" y="0" font-size="10" fill="#00ff41">
      <animate attributeName="y" values="-80;260" dur="3.5s" begin="-1s" calcMode="discrete" repeatCount="indefinite"/>
      <tspan x="14" dy="12">0</tspan>
      <tspan x="14" dy="12">1</tspan>
      <tspan x="14" dy="12">0</tspan>
      <tspan x="14" dy="12">1</tspan>
      <tspan x="14" dy="12">0</tspan>
    </text>
    <text x="28" y="0" font-size="10" fill="#00ff41">
      <animate attributeName="y" values="-100;260" dur="4s" begin="-2s" calcMode="discrete" repeatCount="indefinite"/>
      <tspan x="28" dy="12">1</tspan>
      <tspan x="28" dy="12">1</tspan>
      <tspan x="28" dy="12">0</tspan>
      <tspan x="28" dy="12">1</tspan>
      <tspan x="28" dy="12">0</tspan>
    </text>
  </g>

  <!-- Title bar -->
  <rect x="1" y="1" width="798" height="32" rx="12" fill="#001a00" opacity="0.8"/>
  <rect x="1" y="1" width="798" height="32" rx="12" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
  <text x="24" y="22" font-size="12" fill="#00ff41" font-weight="bold" letter-spacing="2" filter="url(#softGlow)">TECHNICAL COMPETENCY</text>
  <text x="776" y="22" font-size="9" fill="#00aa00" text-anchor="end" letter-spacing="1">CYBERPUNK HUD</text>

  <!-- Accent line under title -->
  <line x1="20" y1="38" x2="780" y2="38" stroke="#00ff41" stroke-width="0.5" opacity="0.4"/>
  <rect x="20" y="37" width="120" height="2" fill="#00ff41" opacity="0.8">
    <animate attributeName="width" values="0;120" dur="1s" begin="0.01s" fill="freeze"/>
  </rect>

  <!-- Card 1: ML / AI -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="372" height="108" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
    <rect x="0" y="0" width="372" height="20" rx="6" fill="#001a00"/>
    <rect x="0" y="14" width="372" height="6" fill="#001a00"/>
    <text x="10" y="14" font-size="10" fill="#00ff41" font-weight="bold" letter-spacing="1">[ ML / AI ]</text>
    <circle cx="358" cy="10" r="3" fill="#00ff41" filter="url(#softGlow)">
      <animate attributeName="fill-opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Python -->
    <text x="10" y="32" font-size="10" fill="#5eead4" font-weight="bold">Python</text>
    <text x="358" y="32" font-size="9" fill="#00aa00" text-anchor="end">95%</text>
    <rect x="10" y="36" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="36" width="0" height="5" rx="2.5" fill="#3776AB" filter="url(#softGlow)">
      <animate attributeName="width" values="0;334" dur="1s" begin="0.01s" fill="freeze"/>
    </rect>

    <!-- PyTorch -->
    <text x="10" y="50" font-size="10" fill="#5eead4" font-weight="bold">PyTorch</text>
    <text x="358" y="50" font-size="9" fill="#00aa00" text-anchor="end">88%</text>
    <rect x="10" y="54" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="54" width="0" height="5" rx="2.5" fill="#EE4C2C" filter="url(#softGlow)">
      <animate attributeName="width" values="0;310" dur="1.1s" begin="0.1s" fill="freeze"/>
    </rect>

    <!-- Hugging Face -->
    <text x="10" y="68" font-size="10" fill="#5eead4" font-weight="bold">Hugging Face</text>
    <text x="358" y="68" font-size="9" fill="#00aa00" text-anchor="end">82%</text>
    <rect x="10" y="72" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="72" width="0" height="5" rx="2.5" fill="#FFD21E" filter="url(#softGlow)">
      <animate attributeName="width" values="0;289" dur="1.2s" begin="0.2s" fill="freeze"/>
    </rect>

    <!-- MLflow -->
    <text x="10" y="86" font-size="10" fill="#5eead4" font-weight="bold">MLflow</text>
    <text x="358" y="86" font-size="9" fill="#00aa00" text-anchor="end">85%</text>
    <rect x="10" y="90" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="90" width="0" height="5" rx="2.5" fill="#C471ED" filter="url(#softGlow)">
      <animate attributeName="width" values="0;300" dur="1.3s" begin="0.3s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 2: Backend -->
  <g transform="translate(408, 48)">
    <rect x="0" y="0" width="372" height="108" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
    <rect x="0" y="0" width="372" height="20" rx="6" fill="#001a00"/>
    <rect x="0" y="14" width="372" height="6" fill="#001a00"/>
    <text x="10" y="14" font-size="10" fill="#00ff41" font-weight="bold" letter-spacing="1">[ Backend ]</text>
    <circle cx="358" cy="10" r="3" fill="#00ff41" filter="url(#softGlow)">
      <animate attributeName="fill-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- FastAPI -->
    <text x="10" y="32" font-size="10" fill="#5eead4" font-weight="bold">FastAPI</text>
    <text x="358" y="32" font-size="9" fill="#00aa00" text-anchor="end">90%</text>
    <rect x="10" y="36" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="36" width="0" height="5" rx="2.5" fill="#009688" filter="url(#softGlow)">
      <animate attributeName="width" values="0;317" dur="1s" begin="0.01s" fill="freeze"/>
    </rect>

    <!-- PostgreSQL -->
    <text x="10" y="50" font-size="10" fill="#5eead4" font-weight="bold">PostgreSQL</text>
    <text x="358" y="50" font-size="9" fill="#00aa00" text-anchor="end">85%</text>
    <rect x="10" y="54" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="54" width="0" height="5" rx="2.5" fill="#4479A1" filter="url(#softGlow)">
      <animate attributeName="width" values="0;299" dur="1.1s" begin="0.1s" fill="freeze"/>
    </rect>

    <!-- Redis -->
    <text x="10" y="68" font-size="10" fill="#5eead4" font-weight="bold">Redis</text>
    <text x="358" y="68" font-size="9" fill="#00aa00" text-anchor="end">80%</text>
    <rect x="10" y="72" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="72" width="0" height="5" rx="2.5" fill="#D82D20" filter="url(#softGlow)">
      <animate attributeName="width" values="0;282" dur="1.2s" begin="0.2s" fill="freeze"/>
    </rect>

    <!-- Qdrant -->
    <text x="10" y="86" font-size="10" fill="#5eead4" font-weight="bold">Qdrant</text>
    <text x="358" y="86" font-size="9" fill="#00aa00" text-anchor="end">78%</text>
    <rect x="10" y="90" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="90" width="0" height="5" rx="2.5" fill="#FF6B6B" filter="url(#softGlow)">
      <animate attributeName="width" values="0;275" dur="1.3s" begin="0.3s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 3: Frontend -->
  <g transform="translate(20, 166)">
    <rect x="0" y="0" width="372" height="96" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
    <rect x="0" y="0" width="372" height="20" rx="6" fill="#001a00"/>
    <rect x="0" y="14" width="372" height="6" fill="#001a00"/>
    <text x="10" y="14" font-size="10" fill="#00ff41" font-weight="bold" letter-spacing="1">[ Frontend ]</text>
    <circle cx="358" cy="10" r="3" fill="#00ff41" filter="url(#softGlow)">
      <animate attributeName="fill-opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- React -->
    <text x="10" y="32" font-size="10" fill="#5eead4" font-weight="bold">React</text>
    <text x="358" y="32" font-size="9" fill="#00aa00" text-anchor="end">85%</text>
    <rect x="10" y="36" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="36" width="0" height="5" rx="2.5" fill="#61DAFB" filter="url(#softGlow)">
      <animate attributeName="width" values="0;299" dur="1s" begin="0.01s" fill="freeze"/>
    </rect>

    <!-- Next.js -->
    <text x="10" y="50" font-size="10" fill="#5eead4" font-weight="bold">Next.js</text>
    <text x="358" y="50" font-size="9" fill="#00aa00" text-anchor="end">82%</text>
    <rect x="10" y="54" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="54" width="0" height="5" rx="2.5" fill="#ffffff" stroke="#00ff41" stroke-width="0.5" filter="url(#softGlow)">
      <animate attributeName="width" values="0;289" dur="1.1s" begin="0.1s" fill="freeze"/>
    </rect>

    <!-- TypeScript -->
    <text x="10" y="68" font-size="10" fill="#5eead4" font-weight="bold">TypeScript</text>
    <text x="358" y="68" font-size="9" fill="#00aa00" text-anchor="end">80%</text>
    <rect x="10" y="72" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="72" width="0" height="5" rx="2.5" fill="#3178C6" filter="url(#softGlow)">
      <animate attributeName="width" values="0;282" dur="1.2s" begin="0.2s" fill="freeze"/>
    </rect>
  </g>

  <!-- Card 4: DevOps -->
  <g transform="translate(408, 166)">
    <rect x="0" y="0" width="372" height="96" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
    <rect x="0" y="0" width="372" height="20" rx="6" fill="#001a00"/>
    <rect x="0" y="14" width="372" height="6" fill="#001a00"/>
    <text x="10" y="14" font-size="10" fill="#00ff41" font-weight="bold" letter-spacing="1">[ DevOps ]</text>
    <circle cx="358" cy="10" r="3" fill="#00ff41" filter="url(#softGlow)">
      <animate attributeName="fill-opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Docker -->
    <text x="10" y="32" font-size="10" fill="#5eead4" font-weight="bold">Docker</text>
    <text x="358" y="32" font-size="9" fill="#00aa00" text-anchor="end">90%</text>
    <rect x="10" y="36" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="36" width="0" height="5" rx="2.5" fill="#2496ED" filter="url(#softGlow)">
      <animate attributeName="width" values="0;317" dur="1s" begin="0.01s" fill="freeze"/>
    </rect>

    <!-- Kubernetes -->
    <text x="10" y="50" font-size="10" fill="#5eead4" font-weight="bold">Kubernetes</text>
    <text x="358" y="50" font-size="9" fill="#00aa00" text-anchor="end">82%</text>
    <rect x="10" y="54" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="54" width="0" height="5" rx="2.5" fill="#326CE5" filter="url(#softGlow)">
      <animate attributeName="width" values="0;289" dur="1.1s" begin="0.1s" fill="freeze"/>
    </rect>

    <!-- AWS -->
    <text x="10" y="68" font-size="10" fill="#5eead4" font-weight="bold">AWS</text>
    <text x="358" y="68" font-size="9" fill="#00aa00" text-anchor="end">85%</text>
    <rect x="10" y="72" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="72" width="0" height="5" rx="2.5" fill="#FF9900" filter="url(#softGlow)">
      <animate attributeName="width" values="0;299" dur="1.2s" begin="0.2s" fill="freeze"/>
    </rect>

    <!-- Terraform -->
    <text x="10" y="86" font-size="10" fill="#5eead4" font-weight="bold">Terraform</text>
    <text x="358" y="86" font-size="9" fill="#00aa00" text-anchor="end">78%</text>
    <rect x="10" y="90" width="352" height="5" rx="2.5" fill="#001a00"/>
    <rect x="10" y="90" width="0" height="5" rx="2.5" fill="#7B42BC" filter="url(#softGlow)">
      <animate attributeName="width" values="0;275" dur="1.3s" begin="0.3s" fill="freeze"/>
    </rect>
  </g>

  <!-- Footer -->
  <rect x="20" y="272" width="760" height="16" rx="4" fill="#001a00" opacity="0.5"/>
  <text x="400" y="284" text-anchor="middle" font-size="9" fill="#00aa00" font-weight="bold" letter-spacing="1">SYSTEM OPERATIONAL</text>
</svg>
