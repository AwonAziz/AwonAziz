<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', 'Noto Sans Mono', monospace">
  <defs>
    <filter id="matrixGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0a0713" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#00ff41" stroke-width="1" rx="12" opacity="0.3"/>

  <!-- Header -->
  <rect x="20" y="14" width="760" height="24" rx="6" fill="#001a00" stroke="#003300" stroke-width="1"/>
  <text x="32" y="32" font-size="12" fill="#00ff41" font-weight="bold" letter-spacing="1">TECHNICAL COMPETENCY</text>
  <text x="748" y="32" font-size="10" fill="#00aa00" text-anchor="end">TECH STACK</text>

  <!-- Column 1: ML / AI -->
  <g transform="translate(20, 50)">
    <text x="0" y="18" font-size="11" fill="#00aa00" font-weight="bold">ML / AI</text>
    <rect x="0" y="26" width="180" height="2" fill="#003300"/>
    <text x="0" y="44" font-size="10.5" fill="#00ff41" font-weight="bold">Python</text>
    <rect x="0" y="50" width="155" height="6" rx="3" fill="#001a00" stroke="#3776AB" stroke-width="1"/>
    <rect x="0" y="50" width="155" height="6" rx="3" fill="#3776AB" opacity="0.9">
      <animate attributeName="width" values="0;155" dur="1s" begin="0.1s"/>
    </rect>
    <text x="0" y="64" font-size="10.5" fill="#00ff41" font-weight="bold">PyTorch</text>
    <rect x="0" y="70" width="140" height="6" rx="3" fill="#001a00" stroke="#EE4C2C" stroke-width="1"/>
    <rect x="0" y="70" width="140" height="6" rx="3" fill="#EE4C2C" opacity="0.9">
      <animate attributeName="width" values="0;140" dur="1.2s" begin="0.2s"/>
    </rect>
    <text x="0" y="84" font-size="10.5" fill="#00ff41" font-weight="bold">Hugging Face</text>
    <rect x="0" y="90" width="130" height="6" rx="3" fill="#001a00" stroke="#FFD21E" stroke-width="1"/>
    <rect x="0" y="90" width="130" height="6" rx="3" fill="#FFD21E" opacity="0.9">
      <animate attributeName="width" values="0;130" dur="1.4s" begin="0.3s"/>
    </rect>
    <text x="0" y="104" font-size="10.5" fill="#00ff41" font-weight="bold">MLflow</text>
    <rect x="0" y="110" width="125" height="6" rx="3" fill="#001a00" stroke="#C471ED" stroke-width="1"/>
    <rect x="0" y="110" width="125" height="6" rx="3" fill="#C471ED" opacity="0.9">
      <animate attributeName="width" values="0;125" dur="1.6s" begin="0.4s"/>
    </rect>
  </g>

  <!-- Column 2: Backend -->
  <g transform="translate(210, 50)">
    <text x="0" y="18" font-size="11" fill="#00aa00" font-weight="bold">Backend</text>
    <rect x="0" y="26" width="180" height="2" fill="#003300"/>
    <text x="0" y="44" font-size="10.5" fill="#00ff41" font-weight="bold">FastAPI</text>
    <rect x="0" y="50" width="160" height="6" rx="3" fill="#001a00" stroke="#009688" stroke-width="1"/>
    <rect x="0" y="50" width="160" height="6" rx="3" fill="#009688" opacity="0.9">
      <animate attributeName="width" values="0;160" dur="1s" begin="0.1s"/>
    </rect>
    <text x="0" y="64" font-size="10.5" fill="#00ff41" font-weight="bold">PostgreSQL</text>
    <rect x="0" y="70" width="150" height="6" rx="3" fill="#001a00" stroke="#4479A1" stroke-width="1"/>
    <rect x="0" y="70" width="150" height="6" rx="3" fill="#4479A1" opacity="0.9">
      <animate attributeName="width" values="0;150" dur="1.2s" begin="0.2s"/>
    </rect>
    <text x="0" y="84" font-size="10.5" fill="#00ff41" font-weight="bold">Redis</text>
    <rect x="0" y="90" width="140" height="6" rx="3" fill="#001a00" stroke="#D82D20" stroke-width="1"/>
    <rect x="0" y="90" width="140" height="6" rx="3" fill="#D82D20" opacity="0.9">
      <animate attributeName="width" values="0;140" dur="1.4s" begin="0.3s"/>
    </rect>
    <text x="0" y="104" font-size="10.5" fill="#00ff41" font-weight="bold">Qdrant</text>
    <rect x="0" y="110" width="130" height="6" rx="3" fill="#001a00" stroke="#FF6B6B" stroke-width="1"/>
    <rect x="0" y="110" width="130" height="6" rx="3" fill="#FF6B6B" opacity="0.9">
      <animate attributeName="width" values="0;130" dur="1.6s" begin="0.4s"/>
    </rect>
  </g>

  <!-- Column 3: Frontend -->
  <g transform="translate(400, 50)">
    <text x="0" y="18" font-size="11" fill="#00aa00" font-weight="bold">Frontend</text>
    <rect x="0" y="26" width="180" height="2" fill="#003300"/>
    <text x="0" y="44" font-size="10.5" fill="#00ff41" font-weight="bold">React</text>
    <rect x="0" y="50" width="155" height="6" rx="3" fill="#001a00" stroke="#61DAFB" stroke-width="1"/>
    <rect x="0" y="50" width="155" height="6" rx="3" fill="#61DAFB" opacity="0.9">
      <animate attributeName="width" values="0;155" dur="1s" begin="0.1s"/>
    </rect>
    <text x="0" y="64" font-size="10.5" fill="#00ff41" font-weight="bold">Next.js</text>
    <rect x="0" y="70" width="150" height="6" rx="3" fill="#001a00" stroke="#000000" stroke-width="1"/>
    <rect x="0" y="70" width="150" height="6" rx="3" fill="#000000" opacity="0.9">
      <animate attributeName="width" values="0;150" dur="1.2s" begin="0.2s"/>
    </rect>
    <text x="0" y="84" font-size="10.5" fill="#00ff41" font-weight="bold">TypeScript</text>
    <rect x="0" y="90" width="145" height="6" rx="3" fill="#001a00" stroke="#3178C6" stroke-width="1"/>
    <rect x="0" y="90" width="145" height="6" rx="3" fill="#3178C6" opacity="0.9">
      <animate attributeName="width" values="0;145" dur="1.4s" begin="0.3s"/>
    </rect>
  </g>

  <!-- Column 4: DevOps -->
  <g transform="translate(590, 50)">
    <text x="0" y="18" font-size="11" fill="#00aa00" font-weight="bold">DevOps</text>
    <rect x="0" y="26" width="180" height="2" fill="#003300"/>
    <text x="0" y="44" font-size="10.5" fill="#00ff41" font-weight="bold">Docker</text>
    <rect x="0" y="50" width="150" height="6" rx="3" fill="#001a00" stroke="#2496ED" stroke-width="1"/>
    <rect x="0" y="50" width="150" height="6" rx="3" fill="#2496ED" opacity="0.9">
      <animate attributeName="width" values="0;150" dur="1s" begin="0.1s"/>
    </rect>
    <text x="0" y="64" font-size="10.5" fill="#00ff41" font-weight="bold">Kubernetes</text>
    <rect x="0" y="70" width="140" height="6" rx="3" fill="#001a00" stroke="#326CE5" stroke-width="1"/>
    <rect x="0" y="70" width="140" height="6" rx="3" fill="#326CE5" opacity="0.9">
      <animate attributeName="width" values="0;140" dur="1.2s" begin="0.2s"/>
    </rect>
    <text x="0" y="84" font-size="10.5" fill="#00ff41" font-weight="bold">AWS</text>
    <rect x="0" y="90" width="135" height="6" rx="3" fill="#001a00" stroke="#FF9900" stroke-width="1"/>
    <rect x="0" y="90" width="135" height="6" rx="3" fill="#FF9900" opacity="0.9">
      <animate attributeName="width" values="0;135" dur="1.4s" begin="0.3s"/>
    </rect>
    <text x="0" y="104" font-size="10.5" fill="#00ff41" font-weight="bold">Terraform</text>
    <rect x="0" y="110" width="130" height="6" rx="3" fill="#001a00" stroke="#7B42BC" stroke-width="1"/>
    <rect x="0" y="110" width="130" height="6" rx="3" fill="#7B42BC" opacity="0.9">
      <animate attributeName="width" values="0;130" dur="1.6s" begin="0.4s"/>
    </rect>
  </g>

  <!-- Footer -->
  <rect x="20" y="368" width="760" height="20" rx="4" fill="#001a00" opacity="0.5"/>
  <text x="400" y="382" text-anchor="middle" font-size="10" fill="#00aa00" font-weight="bold">SYSTEM OPERATIONAL</text>
</svg>
