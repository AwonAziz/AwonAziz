<svg width="420" height="720" viewBox="0 0 420 720" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="'Segoe UI', Verdana, sans-serif">
<defs>
  <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#c471ed"/>
    <stop offset="50%" stop-color="#9b6bff"/>
    <stop offset="100%" stop-color="#c471ed"/>
  </linearGradient>
  <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f0f0f5"/>
    <stop offset="50%" stop-color="#9b9ba8"/>
    <stop offset="100%" stop-color="#e8e8ef"/>
  </linearGradient>
  <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0a2e" stop-opacity="0.96"/>
    <stop offset="100%" stop-color="#2d0a4e" stop-opacity="0.96"/>
  </linearGradient>
  <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
    <stop offset="70%" stop-color="#c471ed" stop-opacity="0"/>
    <stop offset="100%" stop-color="#c471ed" stop-opacity="0.9"/>
  </radialGradient>
  <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="avatarClip"><circle cx="0" cy="0" r="52"/></clipPath>
  <clipPath id="cardClip"><rect x="-110" y="-10" width="220" height="330" rx="20"/></clipPath>
</defs>

<g transform="translate(210,30)">
  <animateTransform attributeName="transform" type="rotate" values="-7;7;-7" dur="4.2s" begin="0s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>

  <circle cx="0" cy="-14" r="7" fill="url(#metalGrad)" stroke="#6b6b78" stroke-width="1.5"/>

  <g>
    <path d="M -13 -8 L -9 210 L 9 210 L 13 -8 Z" fill="url(#strapGrad)"/>
    <text x="0" y="20" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.9" transform="rotate(90 0 20)">AWON AZIZ • AI/MLOps Engineer • AWON AZIZ • AI/MLOps Engineer</text>
  </g>

  <circle cx="0" cy="215" r="12" fill="none" stroke="url(#metalGrad)" stroke-width="5"/>
  <rect x="-3" y="215" width="6" height="16" fill="url(#metalGrad)"/>

  <g transform="translate(0,255)">
    <animateTransform attributeName="transform" type="scale" values="1 1;0.985 1;1 1" dur="4.2s" begin="0s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>

    <rect x="-105" y="-2" width="210" height="322" rx="20" fill="#000000" opacity="0.35" transform="translate(6,10)"/>

    <rect x="-105" y="-6" width="210" height="322" rx="20" fill="url(#glassGrad)" stroke="#c471ed" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="-105" y="-6" width="210" height="60" rx="20" fill="#ffffff" opacity="0.04"/>

    <circle cx="0" cy="70" r="60" fill="url(#ringGlow)" filter="url(#glow2)">
      <animate attributeName="r" values="56;62;56" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="70" r="53" fill="none" stroke="#c471ed" stroke-width="2.5" filter="url(#glow2)"/>

    <g transform="translate(0,70)" clip-path="url(#avatarClip)">
      <rect x="-52" y="-52" width="104" height="104" fill="#0d0716"/>
      <circle cx="0" cy="-10" r="24" fill="#c471ed"/>
      <path d="M-24 12 L0 -6 L24 12 L0 20 Z" fill="#0d0716"/>
      <line x1="-20" y1="14" x2="20" y2="14" stroke="#0d0716" stroke-width="2"/>
      <circle cx="-12" cy="2" r="2" fill="#0d0716"/>
      <circle cx="12" cy="2" r="2" fill="#0d0716"/>
    </g>

    <text x="0" y="142" font-size="16" font-weight="800" fill="#e6edf3" text-anchor="middle">Awon Aziz</text>
    <text x="0" y="164" font-size="11.5" fill="#9b6bff" text-anchor="middle" font-weight="600">AI/MLOps Engineer</text>
    <rect x="-60" y="176" width="120" height="2" fill="#c471ed" opacity=".3"/>

    <g transform="translate(-90,190)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#5eead4" stroke-width="1.5"/>
      <text x="18" y="4" font-size="11" fill="#e6edf3">Islamabad, PK</text>
    </g>
    <g transform="translate(-90,212)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#9b6bff" stroke-width="1.5"/>
      <text x="18" y="4" font-size="11" fill="#e6edf3">MLOps • LLM Eval</text>
    </g>
    <g transform="translate(-90,234)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#c471ed" stroke-width="1.5"/>
      <text x="18" y="4" font-size="11" fill="#e6edf3">Open to Remote</text>
    </g>

    <rect x="-90" y="252" width="180" height="44" rx="8" fill="rgba(255,255,255,.05)" stroke="#c471ed" stroke-opacity=".3" stroke-width="1"/>
    <text x="0" y="274" text-anchor="middle" font-size="11" fill="#e0aaff" font-weight="600">github.com/AwonAziz</text>
    <text x="0" y="288" text-anchor="middle" font-size="10" fill="#9aa4b2">awonaziz786@gmail.com</text>

    <text x="0" y="318" text-anchor="middle" font-size="10" fill="#6f5f96" font-style="italic">Operationalizing ML, one gate at a time.</text>
  </g>
</g>
</svg>
