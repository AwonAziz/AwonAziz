<svg width="420" height="720" viewBox="0 0 420 720" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="'Courier New', 'Noto Sans Mono', monospace">
  <defs>
    <!-- Lanyard strap - dark matrix green -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001a00"/>
      <stop offset="50%" stop-color="#003300"/>
      <stop offset="100%" stop-color="#001a00"/>
    </linearGradient>

    <!-- Metal clip - dark steel -->
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <!-- Holographic card background -->
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#0a0a0a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Holographic sheen overlay -->
    <linearGradient id="holoSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="-20%" stop-color="transparent" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter for matrix green -->
    <filter id="matrixGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline pattern -->
    <pattern id="scanline" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff41" opacity="0.08"/>
    </pattern>

    <clipPath id="avatarClip"><circle cx="0" cy="0" r="52"/></clipPath>
  </defs>

  <!-- Background rect -->
  <rect width="100%" height="100%" fill="none"/>

  <g transform="translate(210,30)">
    <!-- Swinging pendulum animation -->
    <animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="4.5s" begin="0s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>

    <!-- Ceiling hook -->
    <circle cx="0" cy="-14" r="7" fill="url(#clipGrad)" stroke="#00ff41" stroke-width="1" opacity="0.6"/>
    <rect x="-2" y="-14" width="4" height="14" fill="#001a00"/>

    <!-- Lanyard strap -->
    <g>
      <path d="M -14 -8 L -10 210 L 10 210 L 14 -8 Z" fill="url(#strapGrad)" stroke="#003300" stroke-width="1"/>
      <!-- Repeating matrix pattern text on strap -->
      <text x="0" y="15" font-size="9" font-weight="700" fill="#00ff41" text-anchor="middle" opacity="0.5" transform="rotate(90 0 15)">AWON AZIZ • AI/MLOps Engineer • SYSTEM OPERATIONAL • AWON AZIZ • AI/MLOps Engineer • SYSTEM OPERATIONAL</text>
    </g>

    <!-- Metal connector ring -->
    <circle cx="0" cy="218" r="13" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.6" filter="url(#matrixGlow)">
      <animate attributeName="r" values="12;14;12" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="-3" y="218" width="6" height="18" fill="#001a00" stroke="#003300" stroke-width="1"/>

    <!-- Holographic ID Card -->
    <g transform="translate(0,260)">
      <!-- Subtle scale pulse -->
      <animateTransform attributeName="transform" type="scale" values="1 1;1.005 1;1 1" dur="4s" begin="0s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>

      <!-- Card shadow -->
      <rect x="-105" y="0" width="210" height="320" rx="16" fill="#000000" opacity="0.4" transform="translate(8,12)"/>

      <!-- Holographic card body -->
      <rect x="-105" y="-4" width="210" height="320" rx="16" fill="url(#holoGrad)" stroke="#00ff41" stroke-width="1.5" opacity="0.95"/>
      <rect x="-105" y="-4" width="210" height="52" rx="16" fill="#ffffff" opacity="0.03"/>

      <!-- Top terminal header bar -->
      <rect x="-95" y="6" width="190" height="10" rx="4" fill="#001a00"/>
      <circle x="-82" y="11" r="2" fill="#ff3333"/>
      <circle x="-74" y="11" r="2" fill="#ffcc00"/>
      <circle x="-66" y="11" r="2" fill="#33ff33"/>

      <!-- Scanning line animation across header -->
      <rect x="-95" y="6" width="190" height="10" rx="4" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0">
        <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
      </rect>

      <!-- Card content group with scanline overlay -->
      <g clip-path="url(#avatarClip)">
        <!-- scanline overlay will go here -->
      </g>

      <!-- Avatar circle with matrix green glow -->
      <circle cx="0" cy="72" r="58" fill="#001a00" stroke="#00ff41" stroke-width="2" filter="url(#matrixGlow)">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="72" r="52" fill="none" stroke="#00aa00" stroke-width="1" opacity="0.4"/>

      <!-- Avatar placeholder (stylized face in matrix green) -->
      <g transform="translate(0,72)">
        <circle cx="0" cy="-12" r="26" fill="#00ff41" opacity="0.15"/>
        <path d="M-22 8 L0 -8 L22 8 L0 16 Z" fill="#001a00"/>
        <line x1="-18" y1="12" x2="18" y2="12" stroke="#001a00" stroke-width="2"/>
        <circle cx="-10" cy="4" r="2" fill="#001a00"/>
        <circle cx="10" cy="4" r="2" fill="#001a00"/>
      </g>

      <!-- Name with glitch effect -->
      <text x="0" y="146" font-size="17" font-weight="900" fill="#00ff41" text-anchor="middle" filter="url(#matrixGlow)" letter-spacing="2">
        <tspan>Awon Aziz</tspan>
        <animate attributeName="fill" values="#00ff41;#00cc33;#00ff41;#009900;#00ff41" dur="0.8s" repeatCount="indefinite"/>
      </text>

      <!-- Glitch duplicate for name -->
      <text x="1" y="146" font-size="17" font-weight="900" fill="#ff0000" text-anchor="middle" opacity="0">
        <tspan>Awon Aziz</tspan>
        <animate attributeName="opacity" values="0;0;0.3;0;0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="1;-1;1;-1;1" dur="4s" repeatCount="indefinite"/>
      </text>

      <!-- Role -->
      <text x="0" y="170" font-size="11" fill="#00aa00" text-anchor="middle" font-weight="600" letter-spacing="1">AI/MLOps Engineer</text>

      <!-- Divider line -->
      <rect x="-60" y="182" width="120" height="1" fill="#003300" opacity="0.6"/>

      <!-- System status section -->
      <g transform="translate(-90,196)">
        <circle cx="0" cy="0" r="9" fill="none" stroke="#00ff41" stroke-width="1.5"/>
        <text x="16" y="4" font-size="10" fill="#00cc33" font-weight="600">SYSTEM</text>
        <text x="16" y="16" font-size="10" fill="#00ff41">ONLINE</text>
      </g>
      <g transform="translate(-90,218)">
        <circle cx="0" cy="0" r="9" fill="none" stroke="#00ff41" stroke-width="1.5"/>
        <text x="16" y="4" font-size="10" fill="#00cc33" font-weight="600">CLEARANCE</text>
        <text x="16" y="16" font-size="10" fill="#00ff41">LEVEL 5</text>
      </g>
      <g transform="translate(-90,240)">
        <circle cx="0" cy="0" r="9" fill="none" stroke="#00ff41" stroke-width="1.5"/>
        <text x="16" y="4" font-size="10" fill="#00cc33" font-weight="600">STATUS</text>
        <text x="16" y="16" font-size="10" fill="#00ff41">ACTIVE</text>
      </g>

      <!-- Contact section -->
      <rect x="-90" y="258" width="180" height="42" rx="8" fill="#001a00" stroke="#003300" stroke-width="1" opacity="0.8"/>
      <text x="0" y="280" text-anchor="middle" font-size="10" fill="#00aa00" font-weight="600" letter-spacing="1">github.com/AwonAziz</text>
      <text x="0" y="294" text-anchor="middle" font-size="9" fill="#006600">awonaziz786@gmail.com</text>

      <!-- Bottom status bar -->
      <rect x="-105" y="304" width="210" height="12" rx="6" fill="#001a00" stroke="#00ff41" stroke-width="1" opacity="0.3"/>
      <text x="0" y="314" text-anchor="middle" font-size="9" fill="#00ff41" font-weight="600" letter-spacing="1">OPERATIONALIZING ML, ONE GATE AT A TIME</text>

      <!-- Scanline animation overlay -->
      <rect x="-105" y="-4" width="210" height="320" rx="16" fill="url(#scanline)" pointer-events="none">
        <animate attributeName="y" values="-4;316" dur="0.15s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
