<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Me — Awon Aziz" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', Menlo, monospace">
  <title>About Me — Awon Aziz</title>
  <defs>
    <filter id="matrixGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="hexGrid" width="40" height="35" patternUnits="userSpaceOnUse">
      <path d="M20,0 L40,10 L40,25 L20,35 L0,25 L0,10 Z" fill="none" stroke="#00ff41" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
    <pattern id="scanline" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff41" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0a0713" rx="12"/>
  <rect width="100%" height="100%" fill="url(#hexGrid)" rx="12"/>
  <rect width="100%" height="100%" fill="url(#scanline)" rx="12"/>

  <!-- Border -->
  <rect width="100%" height="100%" fill="none" stroke="#00ff41" stroke-width="1" rx="12" opacity="0.25"/>

  <!-- Matrix rain strip (right side, subtle) -->
  <g opacity="0.10" transform="translate(756, 40)">
    <text x="0" y="0" font-size="8" fill="#00ff41">
      <animate attributeName="y" values="-40;360" dur="2.5s" calcMode="discrete" repeatCount="indefinite"/>
      <tspan x="0" dy="10">1</tspan>
      <tspan x="0" dy="10">0</tspan>
      <tspan x="0" dy="10">1</tspan>
      <tspan x="0" dy="10">0</tspan>
    </text>
    <text x="12" y="0" font-size="8" fill="#00ff41">
      <animate attributeName="y" values="-50;360" dur="3s" begin="-0.8s" calcMode="discrete" repeatCount="indefinite"/>
      <tspan x="12" dy="10">0</tspan>
      <tspan x="12" dy="10">1</tspan>
      <tspan x="12" dy="10">0</tspan>
      <tspan x="12" dy="10">1</tspan>
    </text>
  </g>

  <!-- Title bar -->
  <rect x="1" y="1" width="798" height="32" rx="12" fill="#001a00" opacity="0.8"/>
  <rect x="1" y="1" width="798" height="32" rx="12" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
  <text x="24" y="22" font-size="12" fill="#00ff41" font-weight="bold" letter-spacing="1" filter="url(#softGlow)">ABOUT ME</text>
  <text x="776" y="22" font-size="9" fill="#00aa00" text-anchor="end" letter-spacing="1">SYSTEM PROFILE</text>

  <!-- Accent line under title -->
  <line x1="20" y1="38" x2="780" y2="38" stroke="#00ff41" stroke-width="0.5" opacity="0.4"/>
  <rect x="20" y="37" width="120" height="2" fill="#00ff41" opacity="0.8">
    <animate attributeName="width" values="0;120" dur="1s" begin="0.01s" fill="freeze"/>
  </rect>

  <!-- Name and role (right side) -->
  <text x="776" y="62" font-size="20" font-weight="bold" fill="#00ff41" text-anchor="end" filter="url(#matrixGlow)">Awon Aziz</text>
  <text x="776" y="80" font-size="11" fill="#00aa00" text-anchor="end">AI/MLOps Engineer</text>
  <text x="776" y="96" font-size="10" fill="#00aa00" text-anchor="end">LLM Eval · Drift Detection · Promotion Gates</text>

  <!-- Terminal header box -->
  <rect x="20" y="48" width="420" height="56" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
  <text x="32" y="64" font-size="10" fill="#00aa00">[SYSTEM BOOT]</text>
  <text x="32" y="78" font-size="10" fill="#39ff9d">&gt; Loading Awon_Aziz_Profile...</text>
  <text x="32" y="92" font-size="10" fill="#00ff41">[STATUS] &gt; Online ⚙ | Mode: MLOps + LLM Eval</text>

  <!-- Intro text (properly wrapped) -->
  <g transform="translate(20, 116)">
    <text x="0" y="0" font-size="11" fill="#cfc6e8">
      <tspan x="0" dy="0">Hey there! I'm <tspan fill="#00ff41" font-weight="bold">Awon Aziz</tspan> — an AI/MLOps Engineer who bridges the gap</tspan>
      <tspan x="0" dy="16">between training models and operating them in production.</tspan>
    </text>
    <text x="0" y="36" font-size="11" fill="#cfc6e8">
      <tspan x="0" dy="0">I build the operational half of machine learning — evaluation, drift</tspan>
      <tspan x="0" dy="16">detection, and promotion gates. A model isn't finished when it trains</tspan>
      <tspan x="0" dy="16">well; it's finished when you can prove it still works, detect when it</tspan>
      <tspan x="0" dy="16">stops, and refuse to promote a replacement that only looks better.</tspan>
    </text>
  </g>

  <!-- Quick Highlights header -->
  <text x="20" y="210" font-size="12" fill="#00ff41" font-weight="bold" filter="url(#softGlow)">Quick Highlights</text>
  <line x1="20" y1="216" x2="780" y2="216" stroke="#003300" stroke-width="0.5"/>

  <!-- Card 1: Currently building -->
  <g transform="translate(20, 224)">
    <rect x="0" y="0" width="370" height="72" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
    <text x="12" y="16" font-size="10" fill="#5eead4" font-weight="bold">Currently building</text>
    <text x="12" y="32" font-size="10" fill="#cfc6e8">eval-analytics-platform — six evaluation questions</text>
    <text x="12" y="46" font-size="10" fill="#cfc6e8">over a DuckDB star schema · 141 hermetic tests</text>
    <text x="12" y="60" font-size="10" fill="#cfc6e8">5 versioned migrations · 17 charts</text>
  </g>

  <!-- Card 2: Mastering -->
  <g transform="translate(410, 224)">
    <rect x="0" y="0" width="370" height="72" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
    <text x="12" y="16" font-size="10" fill="#00aa00" font-weight="bold">Mastering</text>
    <text x="12" y="32" font-size="10" fill="#cfc6e8">LLM eval harnesses · Drift detection ·</text>
    <text x="12" y="46" font-size="10" fill="#cfc6e8">Promotion gates with measurable guardrails</text>
    <text x="12" y="60" font-size="10" fill="#cfc6e8">Advanced TypeScript · Production LLM evals</text>
  </g>

  <!-- Card 3: Ask me about -->
  <g transform="translate(20, 304)">
    <rect x="0" y="0" width="370" height="40" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
    <text x="12" y="16" font-size="10" fill="#00ff41" font-weight="bold">Ask me about</text>
    <text x="12" y="32" font-size="10" fill="#cfc6e8">PyTorch · ONNX · FastAPI · MLflow · DuckDB · Chroma</text>
  </g>

  <!-- Card 4: Fun Fact -->
  <g transform="translate(410, 304)">
    <rect x="0" y="0" width="370" height="40" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
    <text x="12" y="16" font-size="10" fill="#ffbd6b" font-weight="bold">Fun Fact</text>
    <text x="12" y="32" font-size="10" fill="#cfc6e8">LoRA better calibrated than full FT (ECE 0.0180 vs 0.0306)</text>
  </g>

  <!-- Footer -->
  <rect x="20" y="356" width="760" height="14" rx="3" fill="#001a00" opacity="0.5"/>
  <text x="400" y="367" text-anchor="middle" font-size="9" fill="#00aa00" font-weight="bold" letter-spacing="1">OPERATIONALIZING ML, ONE GATE AT A TIME</text>
</svg>
