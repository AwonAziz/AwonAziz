<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', 'Noto Sans Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0713"/>
      <stop offset="55%" stop-color="#120a24"/>
      <stop offset="100%" stop-color="#180a2e"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#001a00"/>
      <stop offset="50%" stop-color="#003300"/>
      <stop offset="100%" stop-color="#00ff41">
        <animate attributeName="offset" values="1;1.6;1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;1000 0;-300 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="55%" stop-color="#00aa00"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>

    <filter id="matrixGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="640" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="url(#accent)"/>

  <g stroke="#ffffff" stroke-opacity="0.03">
    <path d="M0,160 H1000"/>
    <path d="M0,320 H1000"/>
    <path d="M0,480 H1000"/>
    <path d="M330,6 V634"/>
    <path d="M660,6 V634"/>
  </g>

  <!-- Terminal header -->
  <g transform="translate(40,30)">
    <rect x="0" y="0" width="400" height="86" rx="10" fill="#0d0716" stroke="#003300" stroke-width="1"/>
    <circle cx="16" cy="16" r="4.5" fill="#ff3333"/>
    <circle cx="32" cy="16" r="4.5" fill="#ffcc00"/>
    <circle cx="48" cy="16" r="4.5" fill="#33ff33"/>
    <text x="16" y="38" font-size="12" fill="#00aa00">[SYSTEM BOOT]</text>
    <text x="16" y="56" font-size="12" fill="#39ff9d">&gt; Loading Awon_Aziz_Profile...</text>
    <text x="16" y="74" font-size="12" fill="#00ff41">
      [STATUS] &gt; <tspan fill="#39ff9d">Online &#9881;</tspan> | Mode: MLOps + LLM Eval<tspan fill="#00ff41">_</tspan>
    </text>
    <animate attributeName="fill-opacity" values="1;0;1" dur="0.8s" begin="0.1s" repeatCount="indefinite"/>

    <text x="430" y="34" font-size="34" font-weight="bold" fill="url(#nameGrad)" filter="url(#matrixGlow)" letter-spacing="4">Awon Aziz</text>
    <text x="430" y="60" font-size="13" fill="#00aa00" letter-spacing="0.3">AI/MLOps Engineer</text>
    <text x="430" y="80" font-size="13" fill="#00aa00" letter-spacing="0.3">LLM Eval &#8226; Drift Detection &#8226; Promotion Gates</text>
  </g>

  <!-- AI Node Graph -->
  <g transform="translate(870,120)">
    <circle cx="0" cy="0" r="130" fill="url(#nodeGlow)" filter="url(#matrixGlow)"/>

    <g>
      <circle cx="0" cy="0" r="78" fill="none" stroke="#00ff41" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="4 7"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </g>

    <g stroke="#00ff41" stroke-opacity="0.5" stroke-width="1.3">
      <line x1="0" y1="0" x2="-68" y2="-40"/>
      <line x1="0" y1="0" x2="68" y2="-40"/>
      <line x1="0" y1="0" x2="-68" y2="45"/>
      <line x1="0" y1="0" x2="68" y2="45"/>
      <line x1="0" y1="0" x2="0" y2="-80"/>
    </g>

    <circle r="3" fill="#5eead4">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M0,0 L0,-80"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#00ff41">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M0,0 L68,-40"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#00ff41">
      <animateMotion dur="3.1s" repeatCount="indefinite" path="M0,0 L-68,45"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite"/>
    </circle>

    <circle cx="0" cy="0" r="24" fill="#180a2e" stroke="#00ff41" stroke-width="2">
      <animate attributeName="r" values="24;27;24" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#00ff41" font-weight="bold">AI</text>

    <g font-size="10" fill="#e6e6fa" text-anchor="middle">
      <circle cx="0" cy="-80" r="16" fill="#0d0716" stroke="#5eead4" stroke-width="1.5"/>
      <text x="0" y="-76" fill="#5eead4">n8n</text>

      <circle cx="-68" cy="-40" r="16" fill="#0d0716" stroke="#00aa00" stroke-width="1.5"/>
      <text x="-68" y="-36" fill="#00aa00">JS</text>

      <circle cx="68" cy="-40" r="16" fill="#0d0716" stroke="#00aa00" stroke-width="1.5"/>
      <text x="68" y="-36" fill="#00aa00">API</text>

      <circle cx="-68" cy="45" r="16" fill="#0d0716" stroke="#5eead4" stroke-width="1.5"/>
      <text x="-68" y="49" fill="#5eead4">DB</text>

      <circle cx="68" cy="45" r="16" fill="#0d0716" stroke="#5eead4" stroke-width="1.5"/>
      <text x="68" y="49" fill="#5eead4">UI</text>
    </g>
  </g>
  <text x="870" y="280" text-anchor="middle" font-size="11" fill="#6f5f96">agentic workflow &#8226; always learning</text>

  <!-- Intro -->
  <g font-size="14" fill="#cfc6e8">
    <text x="40" y="160">
      <tspan x="40" dy="0">Hey there! I'm <tspan fill="#e6e6fa" font-weight="600">Awon Aziz</tspan> — an AI/MLOps Engineer who bridges</tspan>
      <tspan x="40" dy="21">the gap between training models and operating them in production.</tspan>
    </text>

    <text x="40" y="252">
      <tspan x="40" dy="0" fill="#e6e6fa" font-weight="600">What drives me?</tspan>
      <tspan x="40" dy="21">I build the operational half of machine learning — evaluation, drift</tspan>
      <tspan x="40" dy="21">detection, and promotion gates. A model isn't finished when it trains</tspan>
      <tspan x="40" dy="21">well; it's finished when you can prove it still works, detect when it</tspan>
      <tspan x="40" dy="21">stops, and refuse to promote a replacement that only looks better.</tspan>
    </text>
  </g>

  <!-- Quick Highlights -->
  <g font-size="14">
    <text x="40" y="410" font-size="15" font-weight="bold" fill="#00ff41">Quick Highlights</text>

    <rect x="40" y="425" width="440" height="92" rx="10" fill="#0d0716" stroke="#003300" stroke-width="1.2"/>
    <text x="60" y="452" font-size="13.5" fill="#5eead4" font-weight="bold">Currently building</text>
    <text x="60" y="474" font-size="12.5" fill="#cfc6e8">eval-analytics-platform — six evaluation questions</text>
    <text x="60" y="491" font-size="12.5" fill="#cfc6e8">over a DuckDB star schema · 141 hermetic tests</text>

    <rect x="500" y="425" width="440" height="92" rx="10" fill="#0d0716" stroke="#003300" stroke-width="1.2"/>
    <text x="520" y="452" font-size="13.5" fill="#00aa00" font-weight="bold">Mastering</text>
    <text x="520" y="474" font-size="12.5" fill="#cfc6e8">LLM eval harnesses, drift detection, and MLOps</text>
    <text x="520" y="491" font-size="12.5" fill="#cfc6e8">promotion gates with measurable guardrails</text>

    <rect x="40" y="527" width="440" height="92" rx="10" fill="#0d0716" stroke="#003300" stroke-width="1.2"/>
    <text x="60" y="554" font-size="13.5" fill="#00ff41" font-weight="bold">Ask me about</text>
    <text x="60" y="576" font-size="12.5" fill="#cfc6e8">PyTorch · ONNX · FastAPI · MLflow · DuckDB ·</text>
    <text x="60" y="593" font-size="12.5" fill="#cfc6e8">Chroma · Kubernetes · GitHub Actions</text>

    <rect x="500" y="527" width="440" height="92" rx="10" fill="#0d0716" stroke="#003300" stroke-width="1.2"/>
    <text x="520" y="552" font-size="13.5" fill="#ffbd6b" font-weight="bold">Fun Fact</text>
    <text x="520" y="572" font-size="11.5" fill="#cfc6e8">LoRA was better calibrated than full fine-tuning</text>
    <text x="520" y="587" font-size="11.5" fill="#cfc6e8">(ECE 0.0180 vs 0.0306)</text>
  </g>

  <rect x="0" y="634" width="1000" height="6" rx="3" fill="url(#accent)"/>
</svg>
