<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', 'Noto Sans Mono', monospace">
  <defs>
    <filter id="matrixGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0a0713" rx="12"/>
  <rect width="100%" height="100%" fill="none" stroke="#00ff41" stroke-width="1" rx="12" opacity="0.3"/>

  <!-- Header -->
  <rect x="20" y="14" width="760" height="36" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
  <text x="32" y="34" font-size="11" fill="#00aa00">[SYSTEM BOOT]</text>
  <text x="32" y="50" font-size="11" fill="#39ff9d">&gt; Loading Awon_Aziz_Profile...</text>
  <text x="32" y="66" font-size="11" fill="#00ff41">[STATUS] &gt; Online &#9881; | Mode: MLOps + LLM Eval</text>

  <text x="820" y="34" font-size="26" font-weight="bold" fill="#00ff41" text-anchor="end" filter="url(#matrixGlow)">Awon Aziz</text>
  <text x="820" y="58" font-size="12" fill="#00aa00" text-anchor="end">AI/MLOps Engineer</text>

  <!-- Intro -->
  <text x="32" y="110" font-size="13" fill="#cfc6e8">Hey there! I'm <tspan fill="#e6e6fa" font-weight="bold">Awon Aziz</tspan> — an AI/MLOps Engineer who bridges the gap between training models and operating them in production.</text>
  <text x="32" y="132" font-size="13" fill="#cfc6e8">I build the operational half of machine learning — evaluation, drift detection, and promotion gates.</text>
  <text x="32" y="154" font-size="13" fill="#cfc6e8">A model isn't finished when it trains well; it's finished when you can prove it still works, detect when it stops, and refuse to promote a replacement that only looks better.</text>

  <!-- Quick Highlights -->
  <text x="32" y="190" font-size="13" fill="#00ff41" font-weight="bold">Quick Highlights</text>

  <!-- Card 1 -->
  <rect x="32" y="200" width="360" height="70" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
  <text x="48" y="220" font-size="11" fill="#5eead4" font-weight="bold">Currently building</text>
  <text x="48" y="236" font-size="11" fill="#cfc6e8">eval-analytics-platform · DuckDB star schema ·</text>
  <text x="48" y="252" font-size="11" fill="#cfc6e8">141 hermetic tests · 5 migrations</text>

  <!-- Card 2 -->
  <rect x="408" y="200" width="360" height="70" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
  <text x="424" y="220" font-size="11" fill="#00aa00" font-weight="bold">Mastering</text>
  <text x="424" y="236" font-size="11" fill="#cfc6e8">LLM eval harnesses · Drift detection ·</text>
  <text x="424" y="252" font-size="11" fill="#cfc6e8">Promotion gates with measurable guardrails</text>

  <!-- Card 3 -->
  <rect x="32" y="280" width="360" height="30" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
  <text x="48" y="296" font-size="11" fill="#00ff41" font-weight="bold">Ask me about</text>
  <text x="190" y="296" font-size="11" fill="#cfc6e8">PyTorch · ONNX · FastAPI · MLflow · DuckDB · Chroma</text>

  <!-- Card 4 -->
  <rect x="408" y="280" width="360" height="30" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
  <text x="424" y="296" font-size="11" fill="#ffbd6b" font-weight="bold">Fun Fact</text>
  <text x="530" y="296" font-size="11" fill="#cfc6e8">LoRA better calibrated than full FT</text>
</svg>
