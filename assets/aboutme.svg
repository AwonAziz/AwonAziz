<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Me" font-family="Consolas, monospace">
  <title>About Me - Awon Aziz</title>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hexGrid" width="40" height="35" patternUnits="userSpaceOnUse">
      <path d="M20,0 L40,10 L40,25 L20,35 L0,25 L0,10 Z" fill="none" stroke="#00ff41" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
    <pattern id="scanline" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff41" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0a0713" rx="12"/>
  <rect width="800" height="400" fill="url(#hexGrid)" rx="12"/>
  <rect width="800" height="400" fill="url(#scanline)" rx="12"/>
  <rect width="800" height="400" fill="none" stroke="#00ff41" stroke-width="1" rx="12" opacity="0.3"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="798" height="32" rx="12" fill="#001a00" opacity="0.8"/>
  <rect x="1" y="1" width="798" height="32" rx="12" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
  <text x="24" y="22" font-size="12" fill="#00ff41" font-weight="bold">ABOUT ME</text>
  <text x="776" y="22" font-size="9" fill="#00aa00" text-anchor="end">SYSTEM PROFILE</text>

  <!-- Accent line -->
  <rect x="20" y="37" width="120" height="2" fill="#00ff41" opacity="0.8"/>

  <!-- Name (right side) -->
  <text x="776" y="62" font-size="20" font-weight="bold" fill="#00ff41" text-anchor="end" filter="url(#glow)">Awon Aziz</text>
  <text x="776" y="80" font-size="11" fill="#00aa00" text-anchor="end">AI/MLOps Engineer</text>
  <text x="776" y="96" font-size="10" fill="#00aa00" text-anchor="end">LLM Eval - Drift Detection - Promotion Gates</text>

  <!-- Terminal box -->
  <rect x="20" y="48" width="420" height="56" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
  <text x="32" y="64" font-size="10" fill="#00aa00">SYSTEM BOOT</text>
  <text x="32" y="78" font-size="10" fill="#39ff9d">Loading Awon_Aziz_Profile...</text>
  <text x="32" y="92" font-size="10" fill="#00ff41">STATUS: Online | Mode: MLOps + LLM Eval</text>

  <!-- Intro -->
  <text x="20" y="120" font-size="11" fill="#cfc6e8">Hey there! I'm Awon Aziz - an AI/MLOps Engineer who bridges the gap</text>
  <text x="20" y="138" font-size="11" fill="#cfc6e8">between training models and operating them in production.</text>
  <text x="20" y="160" font-size="11" fill="#cfc6e8">I build the operational half of machine learning - evaluation, drift</text>
  <text x="20" y="178" font-size="11" fill="#cfc6e8">detection, and promotion gates.</text>

  <!-- Quick Highlights -->
  <text x="20" y="210" font-size="12" fill="#00ff41" font-weight="bold">Quick Highlights</text>
  <line x1="20" y1="216" x2="780" y2="216" stroke="#003300" stroke-width="0.5"/>

  <!-- Card 1 -->
  <rect x="20" y="224" width="370" height="60" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
  <text x="32" y="240" font-size="10" fill="#5eead4" font-weight="bold">Currently building</text>
  <text x="32" y="256" font-size="10" fill="#cfc6e8">eval-analytics-platform - DuckDB star schema</text>
  <text x="32" y="272" font-size="10" fill="#cfc6e8">141 hermetic tests - 5 migrations - 17 charts</text>

  <!-- Card 2 -->
  <rect x="410" y="224" width="370" height="60" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
  <text x="422" y="240" font-size="10" fill="#00aa00" font-weight="bold">Mastering</text>
  <text x="422" y="256" font-size="10" fill="#cfc6e8">LLM eval harnesses - Drift detection</text>
  <text x="422" y="272" font-size="10" fill="#cfc6e8">Promotion gates - TypeScript - Production LLM evals</text>

  <!-- Card 3 -->
  <rect x="20" y="292" width="370" height="40" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
  <text x="32" y="308" font-size="10" fill="#00ff41" font-weight="bold">Ask me about</text>
  <text x="32" y="324" font-size="10" fill="#cfc6e8">PyTorch - ONNX - FastAPI - MLflow - DuckDB - Chroma</text>

  <!-- Card 4 -->
  <rect x="410" y="292" width="370" height="40" rx="6" fill="#0d0716" stroke="#003300" stroke-width="1"/>
  <text x="422" y="308" font-size="10" fill="#ffbd6b" font-weight="bold">Fun Fact</text>
  <text x="422" y="324" font-size="10" fill="#cfc6e8">LoRA better calibrated than full FT (ECE 0.0180 vs 0.0306)</text>

  <!-- Footer -->
  <rect x="20" y="344" width="760" height="14" rx="3" fill="#001a00" opacity="0.5"/>
  <text x="400" y="355" text-anchor="middle" font-size="9" fill="#00aa00" font-weight="bold">OPERATIONALIZING ML, ONE GATE AT A TIME</text>
</svg>
