<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="titleDark descDark">
  <title id="titleDark">Awon Aziz — AI/MLOps Engineer</title>
  <desc id="descDark">Animated hero banner for GitHub profile README. Dark theme.</desc>
  <defs>
    <linearGradient id="heroGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#79b8ff;#58a6ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3fb950">
        <animate attributeName="stop-color" values="#3fb950;#4ec960;#3fb950" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#79b8ff;#58a6ff" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="240" fill="#0d1117" rx="16" />
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="1120" height="160" fill="url(#heroGradDark)" rx="12" opacity="0.9">
      <animate attributeName="opacity" values="0.8;0.95;0.8" dur="4s" repeatCount="indefinite" />
    </rect>
    <circle cx="100" cy="80" r="20" fill="#3fb950" filter="url(#glowDark)">
      <animate attributeName="r" values="16;24;16" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <rect x="920" y="40" width="120" height="80" fill="#161b22" rx="8" opacity="0.95" />
    <rect x="180" y="96" width="4" height="32" fill="#3fb950" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="3s" repeatCount="indefinite" />
  </g>
</svg>
